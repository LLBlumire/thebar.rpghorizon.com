# The Bar: independent configuration and certificate on the shared HTTPS proxy.
proxy_cache_path /var/cache/nginx/thebar levels=1:2 keys_zone=THEBAR:4m
                 max_size=512m min_free=20g inactive=24h use_temp_path=off;
map "$upstream_status:$upstream_http_content_length:$upstream_http_content_type" $bar_no_cache {
    default 1;
    "~^200:[0-9]{1,8}:(?!text/html)" 0;
}
map $uri $bar_document {
    default 0;
    ~*(/|\.html?|\.txt)$ 1;
    ~(^|/)[^/.]+$ 1;
}
map $uri $bar_origin_path {
    default $uri;
    / /index.html;
    /play /play.html;
    /import /import.html;
}
limit_conn_zone $binary_remote_addr zone=BAR_CLIENT:1m;
map $server_name $bar_pool { default thebar; }
limit_conn_zone $bar_pool zone=BAR_TOTAL:1m;
limit_req_zone $bar_pool zone=BAR_RATE:1m rate=50r/s;

server {
    listen 80;
    listen [::]:80;
    server_name thebar.rpghorizon.com;
    return 308 https://thebar.rpghorizon.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name thebar.rpghorizon.com;
    ssl_certificate /etc/letsencrypt/live/thebar-rpghorizon-com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thebar-rpghorizon-com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BAR_TLS:1m;
    ssl_session_tickets off;
    if ($host != thebar.rpghorizon.com) { return 444; }
    if ($ssl_server_name != thebar.rpghorizon.com) { return 421; }
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }
    limit_conn BAR_CLIENT 16;
    limit_conn BAR_TOTAL 32;
    limit_conn_status 503;
    limit_req zone=BAR_RATE burst=100 nodelay;
    limit_req_status 503;
    client_max_body_size 1k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 15s;
    gzip on;
    gzip_vary on;
    gzip_comp_level 1;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/atom+xml;
    access_log /var/log/nginx/thebar.access.log;
    error_log /var/log/nginx/thebar.error.log warn;
    set $bar_bucket_host thebar-rpghorizon-com-production-fr-par.s3-website.fr-par.scw.cloud;
    location = /play/ { return 308 https://thebar.rpghorizon.com/play$is_args$args; }
    location = /import/ { return 308 https://thebar.rpghorizon.com/import$is_args$args; }
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $bar_bucket_host;
        proxy_set_header Connection "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_ssl_server_name on;
        proxy_ssl_name $bar_bucket_host;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        resolver 127.0.0.53 valid=300s ipv6=off;
        resolver_timeout 3s;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;
        proxy_max_temp_file_size 16m;
        proxy_cache THEBAR;
        proxy_cache_key "$bar_bucket_host$request_uri|$http_accept_encoding";
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_revalidate on;
        proxy_cache_valid 200 60s;
        proxy_no_cache $bar_document $bar_no_cache $http_authorization $http_cookie $http_range;
        proxy_cache_bypass $bar_document $http_authorization $http_cookie $http_range;
        proxy_cache_use_stale off;
        proxy_intercept_errors off;
        proxy_redirect https://$bar_bucket_host/ https://thebar.rpghorizon.com/;
        proxy_redirect http://$bar_bucket_host/ https://thebar.rpghorizon.com/;
        proxy_pass https://$bar_bucket_host$bar_origin_path$is_args$args;
    }
}
