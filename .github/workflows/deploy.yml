name: Publish The Bar
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: thebar-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: volta-cli/action@v4
      - uses: cachix/install-nix-action@v31
      - name: Build static site
        run: nix develop -c bash scripts/build.sh
      - name: Verify browser storage and navigation
        run: nix develop -c bash scripts/check.sh
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out/
          include-hidden-files: true
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment: Production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_ACCESS_KEY }}
      S3_BUCKET: thebar-rpghorizon-com-production-fr-par
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out/
      - name: Publish assets, then documents
        run: nix develop -c bash scripts/publish.sh
